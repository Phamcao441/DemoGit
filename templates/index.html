<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR PDF Scan Tiếng Việt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100%;
            background: #f9f9f9;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #219653;
        }
        .note {
            font-size: 14px;
            color: #e67e22;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OCR PDF Scan Tiếng Việt</h1>
        <p>Upload file PDF scan để trích xuất văn bản và tải về file Word</p>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".pdf" required>
            <br>
            <button type="submit">Xử lý và Tải Word</button>
        </form>
        <div class="note">Lưu ý: Chất lượng scan tốt (300dpi+) sẽ cho kết quả chính xác hơn</div>
    </div>
</body>
</html>
