<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống OCR & Dublin Core Metadata</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>📜 Số hóa Tài liệu</h1>
            <p>Trích xuất nội dung bằng AI & Quản lý theo chuẩn Dublin Core</p>
        </header>

        <form action="/upload" method="POST" enctype="multipart/form-data" class="ocr-form">
            <div class="form-grid">
                <div class="input-group">
                    <label>Tiêu đề (dc.title) *</label>
                    <input type="text" name="title" placeholder="Tên sách hoặc tài liệu..." required>
                </div>

                <div class="input-group">
                    <label>Tác giả (dc.creator)</label>
                    <input type="text" name="creator" placeholder="Tên tác giả, tổ chức...">
                </div>

                <div class="input-group">
                    <label>Chủ đề (dc.subject)</label>
                    <input type="text" name="subject" placeholder="Từ khóa, lĩnh vực...">
                </div>

                <div class="input-group">
                    <label>Nhà xuất bản (dc.publisher)</label>
                    <input type="text" name="publisher" placeholder="Nơi phát hành...">
                </div>

                <div class="input-group full-width">
                    <label>Nguồn gốc (dc.source)</label>
                    <input type="text" name="source" placeholder="Link web hoặc nguồn tài liệu gốc...">
                </div>

                <div class="input-group full-width">
                    <label>Chọn tệp tin (PDF, JPG, PNG) *</label>
                    <div class="file-upload">
                        <input type="file" name="file" id="file" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>🚀 Bắt đầu xử lý AI</span>
            </button>
        </form>

        <footer>
            <p>&copy; 2026 - Hệ thống OCR thông minh - Gemini AI Power</p>
        </footer>
    </div>
</body>
</html>
